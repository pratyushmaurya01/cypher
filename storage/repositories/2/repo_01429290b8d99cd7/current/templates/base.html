<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Todo App{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; color: #222; }
    .container { max-width: 480px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1, h2 { margin-top: 0; }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 14px; }
    input[type=text], input[type=password] { width: 100%; padding: 10px; margin: 4px 0 12px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    button.link { background: none; color: #2563eb; padding: 0; }
    button.danger { background: #dc2626; padding: 6px 10px; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    li form { display: inline; margin: 0; }
    .done .title { text-decoration: line-through; color: #888; }
    .errorlist { color: #dc2626; padding-left: 16px; font-size: 13px; }
    .helptext { font-size: 12px; color: #777; display: block; margin-bottom: 8px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <strong>Todo App</strong>
      {% if user.is_authenticated %}
        <span>
          {{ user.username }} |
          <form method="post" action="{% url 'logout' %}" style="display:inline">
            {% csrf_token %}
            <button type="submit" class="link">Logout</button>
          </form>
        </span>
      {% endif %}
    </nav>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
